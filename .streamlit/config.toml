# Streamlit settings for this project.
[server]
headless = true          # skip Streamlit's first-run e-mail prompt (run.bat opens the browser itself)
port = 8501
# Security: run.bat starts the dashboard with --server.address localhost, so on your computer
# only you can open it (anyone on the same Wi-Fi could otherwise use it with no login). It is set
# there, not here, because Streamlit Cloud reads this file too and must serve the public demo.

[browser]
gatherUsageStats = false

[client]
# Hides Streamlit's "Deploy" button, which could publish this dashboard to the public
# internet with no login.
toolbarMode = "minimal"

# Look and feel (ATHAR): one dark theme, a formal government-report style. Our own design.
# - Deep navy surfaces, hairline borders, generous spacing. Gold is the ONLY action colour (buttons, links,
#   the selected tab); the brand green appears only in the emblem's rule. Red / orange / green are kept for
#   risk levels, each paired with a shape (▲ ◆ ●), so a colour never means two things.
# - IBM Plex Sans Arabic is designed for Arabic AND Latin, so both languages read as one product; the Arabic
#   wordmark uses Noto Kufi Arabic (loaded in app.py). Free Google Fonts, no font files in the repo. If the
#   fonts can't load (offline), the system font is used.
# - Contrast on the navy background: text 14.6:1, gold 8.6:1, risk red 6.4:1, orange 7.3:1, green 8.1:1.
[theme]
base = "dark"
primaryColor = "#D4B46A" # gold
backgroundColor = "#0D1B2A" # deep navy
secondaryBackgroundColor = "#132538"
textColor = "#E7ECF2"
borderColor = "#24384F"
dataframeBorderColor = "#24384F"
dataframeHeaderBackgroundColor = "#132538"
linkColor = "#D4B46A"
linkUnderline = false
redColor = "#F07B72"
orangeColor = "#F0883E"
greenColor = "#5BC48C"
yellowColor = "#D4B46A"
codeBackgroundColor = "#132538"
codeTextColor = "#E7ECF2"
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
font = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"
headingFont = "'IBM Plex Sans Arabic', sans-serif"
headingFontWeights = [600, 600, 600, 500, 500, 500]
codeFont = "monospace" # domains and URLs show in monospace, like evidence labels
showWidgetBorder = true
showSidebarBorder = true
