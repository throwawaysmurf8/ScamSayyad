# Streamlit settings for this project.
[server]
headless = true          # skip Streamlit's first-run e-mail prompt (run.bat opens the browser itself)
port = 8501
# Security: run.bat starts the dashboard with --server.address localhost, so on your computer
# only you can open it (anyone on the same Wi-Fi could otherwise use it with no login). It is set
# there, not here, because Streamlit Cloud reads this file too and must serve the public demo.

[browser]
gatherUsageStats = false

[client]
# Hides Streamlit's "Deploy" button, which could publish this dashboard to the public
# internet with no login.
toolbarMode = "minimal"

# Look and feel (Atharalanaq): desert colours. Follows the computer's light/dark setting.
# - Light = sand by day, dark = the desert at night. Plain colours only, no pictures.
# - Date-palm brown (light) / dune gold (dark) is the ONLY action colour; red / orange / green are kept
#   for risk levels only, so a colour never means two things.
# - Readex Pro (headings) and IBM Plex Sans Arabic (body) are designed for Arabic AND Latin, so English
#   and Arabic look like one product. If the fonts can't load (offline), the system font is used.
# - Every text colour passes WCAG AA: light 12.8-14.8:1, dark 13.7-15.1:1; action colour 5.4-9.7:1.
[theme]
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
font = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
headingFont = "'Readex Pro':https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&display=swap"
codeFont = "monospace"   # domains and URLs show in monospace, like evidence labels
showWidgetBorder = true

[theme.light]
primaryColor = "#8A4B1F"             # date-palm brown: 6.2:1 on sand, 5.4:1 on dune
backgroundColor = "#FAF5EC"          # pale sand
secondaryBackgroundColor = "#F0E4CF" # dune
textColor = "#2B1F14"                # dark earth: 14.8:1
borderColor = "#DCCBAE"
dataframeHeaderBackgroundColor = "#F0E4CF"

[theme.dark]
primaryColor = "#E2B574"             # dune gold: 9.7:1 on the night background
backgroundColor = "#18130F"          # desert night
secondaryBackgroundColor = "#241C15"
textColor = "#F1E7D6"                # moonlit sand: 15.1:1
borderColor = "#3C3026"
dataframeHeaderBackgroundColor = "#241C15"
